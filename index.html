<body data-scholarcy-content-script-executed="1">

    <!-- Image first -->

    <!-- Heading -->
    <h1> 🎀 HELLO THERE 🎀 </h1>
    <h2 id="mot">Yay !! I LOVE YOU so much 💖</h2>

        <strong>XXXXXXX</strong><br>

    <div>

        <small>yyyyyyy</small><br><br>

    <div>
        <button class="bouton" onclick="changeImage('YES')">YES</button> 
        &nbsp;&nbsp;
        <button class="bouton" onclick="changeImage('NO')">NO</button>
    </div>

    <!-- ----- LOOP END ----- -->

    <div><span class="enveloppe">💌</span></div>

    <script>
        function changeImage(choice) {
            const img=document.getElementById('img-chat');
            const mot=document.getElementById('mot');
            // Update the *first* secret box for demo; you could target others similarly
            const secret=document.getElementById('secret1');
            if(choice=='YES') {
                img.src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExODBzY214bDQwZ2NjemFkeXpwNHg2aWFzcmR2cHhjdWN0ODQ5cDE1bCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/D9j761FH8SYJLyW9WO/giphy.gif";
                mot.textContent = "Yay !! I LOVE YOU so much 💖";
                secret.innerHTML = "<strong>XXXXXXX</strong><br><small>yyyyyyy</small><br><br>";
            } else if(choice=='NO') {
                img.src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExc2hvb213aTJuYXBvYmVwdDZsNjhidTExbnRra2V5ZTRvMDNwYzU5MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/9KI8vyCCAOqHbcMYd2/giphy.gif";
                mot.textContent = "Are you sure.... ??";
                secret.textContent = ">:(((";
            }
        }
    </script>
